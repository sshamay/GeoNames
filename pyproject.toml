[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geonames"
version = "0.1.0"
description = "Pytest automation scaffold for the GeoNames project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "urllib3<2",
    "langchain-core>=1.3",
    "langchain-classic>=1.0",
    "langchain-ollama>=1.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.10",
    "pydantic>=2.0",
    "langchain-community>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests with mocks (no network)",
    "integration: tests that exercise real or stubbed dependencies",
    "services: tests that exercise GeoNames service endpoints via the client",
    "user_flow: tests that orchestrate multiple GeoNames services end to end",
    "ai_assistant: tests for the Ask-about-a-location assistant",
]
addopts = "-ra --strict-markers"
filterwarnings = [
    # llangchain-community is sunset but is an upstream dep of langchain-classic;
    # suppress its noisy deprecation notice rather than failing the suite on it.
    "ignore:.*langchain-community. is being sunset.*:DeprecationWarning",
]
