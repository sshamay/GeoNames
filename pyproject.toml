[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geonames"
version = "0.1.0"
description = "Pytest automation scaffold for the GeoNames project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "urllib3<2",  # system Python 3.9 uses LibreSSL 2.8.3, unsupported by urllib3 v2
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.10",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests with mocks (no network)",
    "integration: tests that exercise real or stubbed dependencies",
    "services: tests that exercise GeoNames service endpoints via the client",
    "user_flow: tests that orchestrate multiple GeoNames services end to end",
    "ai_assistant: tests for the Ask-about-a-location LLM assistant",
]
addopts = "-ra --strict-markers"
