[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua"
version = "0.1.0"
description = "AQuA: a portable AI quality engineering framework for golden-anchor evaluation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.10",
]

[project.entry-points.pytest11]
aqua = "aqua.plugin"

[project.scripts]
aqua = "aqua.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aqua = [
    "sample_golden_anchor.json",
    "aqua_config.example.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests with mocks (no network)",
]
addopts = "-ra --strict-markers"
